[project]
name = "salvai-be"
version = "0.1.0"
description = "Salvai backend API"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "instaloader>=4.15.1",
    "lxml>=5.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
    "supabase>=2.10.0",
    "trafilatura>=1.12.0",
    "uvicorn[standard]>=0.47.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "taskipy>=1.14.0",
]

[tool.taskipy.tasks]
dev = "uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload"
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
