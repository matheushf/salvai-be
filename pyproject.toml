[project]
name = "salvai-be"
version = "0.1.0"
description = "Salvai backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "instaloader>=4.15.1",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
    "supabase>=2.10.0",
    "uvicorn[standard]>=0.47.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
